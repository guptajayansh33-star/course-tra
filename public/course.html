<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Course Video</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <main class="video-container">


        <a
            href="dashboard.html"
            class="back-btn"
        >
            ← Back to Course
        </a>


        <video
            id="courseVideo"
            class="video-player"
            controls
        >

            Your browser does not support
            video playback.

        </video>


        <h1
            id="videoTitle"
            class="video-title"
        >
            Course Video
        </h1>


        <p
            id="videoDescription"
            class="video-description"
        >
            Course lesson
        </p>


    </main>


    <script src="js/script.js"></script>


    <script>

        // Get lesson number from URL

        const params =
            new URLSearchParams(
                window.location.search
            );

        const lesson =
            params.get("lesson");


        // Course lessons

        const lessons = {

            "1": {
                title: "Lesson 1 - Introduction to Java",

                description:
                    "Introduction to Java programming and its basic concepts.",

                video:
                    "videos/lesson1.mp4"
            },


            "2": {
                title: "Lesson 2 - Variables and Data Types",

                description:
                    "Learn about variables and different data types in Java.",

                video:
                    "videos/lesson2.mp4"
            },


            "3": {
                title: "Lesson 3 - Object Oriented Programming",

                description:
                    "Introduction to OOP concepts such as classes and objects.",

                video:
                    "videos/lesson3.mp4"
            }

        };


        // Get selected lesson

        const selectedLesson =
            lessons[lesson];


        if (selectedLesson) {

            document.getElementById(
                "videoTitle"
            ).textContent =
                selectedLesson.title;


            document.getElementById(
                "videoDescription"
            ).textContent =
                selectedLesson.description;


            document.getElementById(
                "courseVideo"
            ).src =
                selectedLesson.video;

        }

    </script>


</body>

</html>
