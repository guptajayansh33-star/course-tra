<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#05070c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Sign in to your VIP Course Student Portal.">

    <title>VIP Portal Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/images/icon-192.png">
    <link rel="apple-touch-icon" href="/images/icon-192.png">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

    <!-- Ambient Glow Background -->
    <div class="bg-animation">
        <div class="bg-gradient"></div>
        <div class="bg-orb bg-orb-1"></div>
        <div class="bg-orb bg-orb-2"></div>
        <div class="particles" id="particles"></div>
    </div>

    <div class="login-container">

        <div class="login-box" id="loginBox">

            <!-- Login Required Info Banner -->
            <div class="login-info-banner" id="loginInfoBanner" style="display:none">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
                <span>Please sign in to access course video stream</span>
            </div>

            <div class="login-brand">
                <div class="brand-icon">
                    <svg width="46" height="46" viewBox="0 0 40 40" fill="none">
                        <defs>
                            <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#a855f7" />
                                <stop offset="100%" style="stop-color:#6366f1" />
                            </linearGradient>
                        </defs>
                        <rect x="2" y="2" width="36" height="36" rx="11" fill="url(#logoGrad)" />
                        <path d="M12 14L20 10L28 14V22L20 26L12 22V14Z" fill="white" opacity="0.95" />
                        <path d="M20 18L28 14" stroke="white" stroke-width="1.5" opacity="0.6" />
                        <path d="M20 18V26" stroke="white" stroke-width="1.5" opacity="0.6" />
                        <path d="M20 18L12 14" stroke="white" stroke-width="1.5" opacity="0.6" />
                    </svg>
                </div>
                <h1>Login Portal</h1>
                <p class="brand-subtitle">Enter your credentials to access lessons</p>
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="17" height="17" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg>
                        <input type="text" id="username" placeholder="Enter username" required autocomplete="username"
                            autocapitalize="none">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="17" height="17" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                        </svg>
                        <input type="password" id="password" placeholder="Enter password" required
                            autocomplete="current-password">
                        <button type="button" class="toggle-password" id="togglePassword"
                            aria-label="Toggle password visibility">
                            <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                            <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                style="display:none">
                                <path
                                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                                <line x1="1" y1="1" x2="23" y2="23" />
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <span class="btn-text">Unlock Dashboard</span>
                    <span class="btn-loader" style="display:none">
                        <svg class="spinner" width="18" height="18" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none"
                                stroke-dasharray="31.4 31.4" stroke-linecap="round" />
                        </svg>
                    </span>
                    <svg class="btn-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12" />
                        <polyline points="12 5 19 12 12 19" />
                    </svg>
                </button>

                <p id="errorMessage" class="error-message"></p>

            </form>

            <div class="login-footer">
                <a href="index.html" class="browse-courses-link">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5">
                        <line x1="19" y1="12" x2="5" y2="12" />
                        <polyline points="12 19 5 12 12 5" />
                    </svg>
                    <span>Back to Explore</span>
                </a>
                <div class="security-badges">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                    </svg>
                    <span>Encrypted Portal</span>
                </div>
            </div>

        </div>

    </div>

    <!-- Mobile Bottom Dock (App Bar) -->
    <div class="mobile-bottom-dock">
        <a href="index.html" class="dock-tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            </svg>
            <span>Home</span>
        </a>
        <a href="login.html" class="dock-tab active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
            </svg>
            <span>Sign In</span>
        </a>
    </div>

    <script src="js/script.js"></script>
    <script>
        // Password toggle
        const toggleBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        if (toggleBtn) {
            toggleBtn.addEventListener('click', function () {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                this.querySelector('.eye-open').style.display = type === 'password' ? 'block' : 'none';
                this.querySelector('.eye-closed').style.display = type === 'password' ? 'none' : 'block';
            });
        }

        // Particle background
        function createParticles() {
            const container = document.getElementById('particles');
            if (!container) return;
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.width = (Math.random() * 3 + 1.5) + 'px';
                particle.style.height = particle.style.width;
                particle.style.animationDelay = (Math.random() * 6) + 's';
                particle.style.animationDuration = (Math.random() * 8 + 6) + 's';
                container.appendChild(particle);
            }
        }
        createParticles();

        // Check if message query param
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('msg') === 'login_required') {
            const banner = document.getElementById('loginInfoBanner');
            if (banner) banner.style.display = 'flex';
        }

        // Entrance animation
        window.addEventListener('load', function () {
            document.getElementById('loginBox').classList.add('animate-in');
        });
    </script>

</body>

</html>
